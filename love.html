
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鲍郑瑄</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: #000;
}

canvas {
    position: absolute;
    width: 100%;
    height: 100%;
}

#pinkboard {
    animation: anim 1.5s ease-in-out infinite;
}

@keyframes anim {
    0% { transform: scale(0.8); }
    25% { transform: scale(0.7); }
    50% { transform: scale(1); }
    75% { transform: scale(0.7); }
    100% { transform: scale(0.8); }
}

#name {
    position: absolute;
    z-index: 2;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    margin-top: -20px;
    font-size: 46px;
    color: #ea80b0;
}
</style>
</head>

<body>
<canvas id="pinkboard"></canvas>
<canvas id="canvas"></canvas>

<script>
const colors = [
    "#eec996", "#8fb7d3", "#b7d4c6", "#c3bedd",
    "#f1d5e4", "#cae1d3", "#f3c89d", "#d0b0c3",
    "#819d53", "#c99294", "#cec884", "#ff8e70",
    "#e0a111", "#fffdf6", "#cbd7ac", "#e8c6c0",
    "#dc9898", "#ecc8ba"
];

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let ww = window.innerWidth;
let wh = window.innerHeight;
let hearts = [];

function resize() {
    ww = window.innerWidth;
    wh = window.innerHeight;

    canvas.width = ww;
    canvas.height = wh;

    const pinkboard = document.getElementById("pinkboard");
    pinkboard.width = ww;
    pinkboard.height = wh;
}

window.addEventListener("resize", resize);

function init() {
    resize();

    for (let i = 0; i < 100; i++) {
        hearts.push(new Heart());
    }

    requestAnimationFrame(render);
}

function Heart() {
    this.x = Math.random() * ww;
    this.y = Math.random() * wh;
    this.opacity = Math.random() * 0.5 + 0.5;

    this.vel = {
        x: (Math.random() - 0.5) * 4,
        y: (Math.random() - 0.5) * 4
    };

    this.targetScale = Math.random() * 0.15 + 0.02;
    this.scale = this.targetScale * Math.random();
    this.width = 473.8;
    this.height = 408.6;
}

Heart.prototype.update = function () {
    this.x += this.vel.x;
    this.y += this.vel.y;

    this.scale += (this.targetScale - this.scale) * 0.01;

    if (this.x - this.width > ww || this.x + this.width < 0) {
        this.scale = 0;
        this.x = Math.random() * ww;
    }

    if (this.y - this.height > wh || this.y + this.height < 0) {
        this.scale = 0;
        this.y = Math.random() * wh;
    }
};

Heart.prototype.draw = function (i) {
    ctx.globalAlpha = this.opacity;
    ctx.font = `${180 * this.scale}px "微软雅黑"`;
    ctx.fillStyle = colors[i % colors.length];

    ctx.fillText(
        "鲍郑瑄",
        this.x - this.width * 0.5,
        this.y - this.height * 0.5,
        this.width
    );
};

function render() {
    ctx.clearRect(0, 0, ww, wh);

    for (let i = 0; i < hearts.length; i++) {
        hearts[i].update();
        hearts[i].draw(i);
    }

    ctx.globalAlpha = 1;
    requestAnimationFrame(render);
}

init();
</script>

<script>
const settings = {
    particles: {
        length: 500,
        duration: 2,
        velocity: 100,
        effect: -0.75,
        size: 30
    }
};

// 点坐标
function Point(x, y) {
    this.x = x || 0;
    this.y = y || 0;
}

Point.prototype.clone = function () {
    return new Point(this.x, this.y);
};

Point.prototype.length = function (length) {
    if (length === undefined) {
        return Math.sqrt(this.x * this.x + this.y * this.y);
    }

    this.normalize();
    this.x *= length;
    this.y *= length;
    return this;
};

Point.prototype.normalize = function () {
    const length = this.length();

    if (length !== 0) {
        this.x /= length;
        this.y /= length;
    }

    return this;
};

// 爱心粒子
function Particle() {
    this.position = new Point();
    this.velocity = new Point();
    this.acceleration = new Point();
    this.age = 0;
}

Particle.prototype.initialize = function (x, y, dx, dy) {
    this.position.x = x;
    this.position.y = y;

    this.velocity.x = dx;
    this.velocity.y = dy;

    this.acceleration.x = dx * settings.particles.effect;
    this.acceleration.y = dy * settings.particles.effect;

    this.age = 0;
};

Particle.prototype.update = function (deltaTime) {
    this.position.x += this.velocity.x * deltaTime;
    this.position.y += this.velocity.y * deltaTime;

    this.velocity.x += this.acceleration.x * deltaTime;
    this.velocity.y += this.acceleration.y * deltaTime;

    this.age += deltaTime;
};

Particle.prototype.draw = function (context, image) {
    function ease(t) {
        return --t * t * t + 1;
    }

    const size = image.width *
        ease(this.age / settings.particles.duration);

    context.globalAlpha =
        1 - this.age / settings.particles.duration;

    context.drawImage(
        image,
        this.position.x - size / 2,
        this.position.y - size / 2,
        size,
        size
    );
};

// 粒子池
function ParticlePool(length) {
    this.particles = Array.from(
        { length },
        () => new Particle()
    );

    this.firstActive = 0;
    this.firstFree = 0;
    this.duration = settings.particles.duration;
}

ParticlePool.prototype.add = function (x, y, dx, dy) {
    this.particles[this.firstFree].initialize(x, y, dx, dy);

    this.firstFree++;

    if (this.firstFree === this.particles.length) {
        this.firstFree = 0;
    }

    if (this.firstActive === this.firstFree) {
        this.firstActive++;

        if (this.firstActive === this.particles.length) {
            this.firstActive = 0;
        }
    }
};

ParticlePool.prototype.update = function (deltaTime) {
    const updateOne = (i) => {
        this.particles[i].update(deltaTime);
    };

    if (this.firstActive < this.firstFree) {
        for (let i = this.firstActive; i < this.firstFree; i++) {
            updateOne(i);
        }
    } else if (this.firstActive > this.firstFree) {
        for (let i = this.firstActive; i < this.particles.length; i++) {
            updateOne(i);
        }

        for (let i = 0; i < this.firstFree; i++) {
            updateOne(i);
        }
    }

    while (
        this.firstActive !== this.firstFree &&
        this.particles[this.firstActive].age >= this.duration
    ) {
        this.firstActive++;

        if (this.firstActive === this.particles.length) {
            this.firstActive = 0;
        }
    }
};

ParticlePool.prototype.draw = function (context, image) {
    const drawOne = (i) => {
        this.particles[i].draw(context, image);
    };

    if (this.firstActive < this.firstFree) {
        for (let i = this.firstActive; i < this.firstFree; i++) {
            drawOne(i);
        }
    } else if (this.firstActive > this.firstFree) {
        for (let i = this.firstActive; i < this.particles.length; i++) {
            drawOne(i);
        }

        for (let i = 0; i < this.firstFree; i++) {
            drawOne(i);
        }
    }
};

// 在爱心曲线上计算位置
function pointOnHeart(t) {
    return new Point(
        160 * Math.pow(Math.sin(t), 3),
        130 * Math.cos(t)
        - 50 * Math.cos(2 * t)
        - 20 * Math.cos(3 * t)
        - 10 * Math.cos(4 * t)
        + 25
    );
}

// 创建爱心粒子图案
(function (canvas) {
    const context = canvas.getContext("2d");
    const particles = new ParticlePool(settings.particles.length);

    const particleRate =
        settings.particles.length / settings.particles.duration;

    let time;

    const imageCanvas = document.createElement("canvas");
    const imageContext = imageCanvas.getContext("2d");

    imageCanvas.width = settings.particles.size;
    imageCanvas.height = settings.particles.size;

    function to(t) {
        const point = pointOnHeart(t);

        point.x = settings.particles.size / 2
            + point.x * settings.particles.size / 350;

        point.y = settings.particles.size / 2
            - point.y * settings.particles.size / 350;

        return point;
    }

    imageContext.beginPath();

    let t = -Math.PI;
    let point = to(t);

    imageContext.moveTo(point.x, point.y);

    while (t < Math.PI) {
        t += 0.01;
        point = to(t);
        imageContext.lineTo(point.x, point.y);
    }

    imageContext.closePath();
    imageContext.fillStyle = "#B22222";
    imageContext.fill();

    const image = new Image();
    image.src = imageCanvas.toDataURL();

    function onResize() {
        canvas.width = canvas.clientWidth;
        canvas.height = canvas.clientHeight;
    }

    window.addEventListener("resize", onResize);
    onResize();

    function render() {
        requestAnimationFrame(render);

        const newTime = performance.now() / 1000;
        const deltaTime = Math.min(newTime - (time || newTime), 0.05);
        time = newTime;

        context.clearRect(0, 0, canvas.width, canvas.height);

        const amount = particleRate * deltaTime;

        for (let i = 0; i < amount; i++) {
            const pos = pointOnHeart(
                Math.PI - 2 * Math.PI * Math.random()
            );

            const dir = pos.clone().length(
                settings.particles.velocity
            );

            particles.add(
                canvas.width / 2 + pos.x,
                canvas.height / 2 - pos.y,
                dir.x,
                -dir.y
            );
        }

        particles.update(deltaTime);
        particles.draw(context, image);
    }

    setTimeout(() => {
        onResize();
        render();
    }, 10);
})(document.getElementById("pinkboard"));
</script>
</body>
</html>
